# the RunOS node agent release pipeline, run by foreman on the foreman HOST (FCR #188).
#
# This repo is PUBLIC and its artefacts are built by GitHub Actions, not here.
# Foreman's job is therefore narrower than for a cluster deploy: run this repo's
# own gate chain, tag, push, then WATCH the workflow that does the building and
# verify what it published.
#
# The gate chain is NOT reimplemented here, on purpose. scripts/release.sh
# carries an unskippable leak gate that exists because real internal identifiers
# were published to a public repo and could not be unpublished. A second copy in
# foreman would be the copy that drifts, and the one that drifts is the one that
# fails open. So step one calls the script's own --check mode, which runs every
# gate and stops before any side effect.
#
# What foreman adds over running the script by hand: each step is recorded with
# its command, exit code, duration and output, and the run appears in the same
# deploy history as the cluster rollouts, so "list all the deploys" means all of
# them rather than one list per mechanism.
#
# gh authenticates from the host keyring, so no credential is injected here. The
# token never has to exist in foreman's store to begin with.

name: Release the RunOS node agent
description: Run this repo's full gate chain, tag and push, then watch the GitHub Actions release and verify what it published.
kind: github_release

steps:
  - name: Gate chain
    description: "scripts/release.sh --check: preflight, sensitivity scan, leak gate, scannability gate and the build/vet/test suite. Every gate, no side effects, and it cannot be skipped."
    run: scripts/release.sh "${{ version }}" --check
    timeout: 1800

  - name: Tag and push
    description: Tags the integration branch and pushes both. main is never touched here; the human merges it after their own verification.
    run: |
      git checkout --quiet ${{ target.branch }}
      sha="$(git rev-parse --short HEAD)"
      git tag "${{ version }}"
      git push --quiet origin ${{ target.branch }}
      git push --quiet origin "${{ version }}"
      echo "tagged ${{ version }} at $sha and pushed"

  - name: Wait for the release workflow
    description: GitHub builds the artefacts. Poll for the run this tag started, then block on it. A failed workflow fails the deploy.
    run: |
      run_id=""; waited=0
      while [ -z "$run_id" ] && [ "$waited" -lt 120 ]; do
        run_id="$(gh run list --workflow=release.yml --limit 15 \
          --json databaseId,headBranch,event \
          -q "[.[] | select(.headBranch==\"${{ version }}\" and .event==\"push\")][0].databaseId" 2>/dev/null || true)"
        [ -n "$run_id" ] && break
        sleep 10; waited=$((waited + 10))
      done
      test -n "$run_id" || { echo "no release run found for ${{ version }}"; exit 1; }
      echo "watching run $run_id"
      gh run watch "$run_id" --exit-status >/dev/null 2>&1 \
        || { echo "release workflow $run_id failed (gh run view $run_id --log-failed)"; exit 1; }
      echo "release workflow succeeded"
    timeout: 1800

  - name: Verify the published attestation
    description: Proves the artefact GitHub published was built by THIS workflow at THIS tag, not by something else. Binds the signer identity, not just the signature.
    run: |
      tmp="$(mktemp -d)"
      trap "rm -rf $tmp" EXIT
      nwo="$(gh api repos/{owner}/{repo} --jq .full_name)"
      gh release download "${{ version }}" --repo "$nwo" --pattern "nodeagent-linux-amd64" --dir "$tmp" --clobber
      expected="https://github.com/$nwo/.github/workflows/release.yml@refs/tags/${{ version }}"
      actual="$(gh attestation verify "$tmp/nodeagent-linux-amd64" --repo "$nwo" --format json 2>/dev/null \
        | python3 -c "import json,sys; d=json.load(sys.stdin); print(d[0][\"verificationResult\"][\"signature\"][\"certificate\"].get(\"subjectAlternativeName\",\"\"))" 2>/dev/null || true)"
      test -n "$actual" || { echo "attestation returned no signer identity"; exit 1; }
      test "$actual" = "$expected" || { echo "attestation identity mismatch: expected $expected, got $actual"; exit 1; }
      echo "attestation bound to $actual"
    timeout: 300

  - name: Advance the deployed branch
    description: The record of what has actually shipped. Fast-forwarded only now, on success. main stays clean for the human.
    run: |
      git branch -f deployed ${{ target.branch }}
      git push --quiet origin deployed
      echo "deployed now at $(git rev-parse --short deployed)"
